CONFIG_SYS_CONFIG_NAME="platform-top"
CONFIG_BOOT_SCRIPT_OFFSET=0x9C0000
CONFIG_SYS_BOOTM_LEN=0x10000000
# The control DT has no current-speed on the UART node, so U-Boot takes the
# console baud from this default.  Keep it equal to the PS7 UART setting.
CONFIG_BAUDRATE=921600
