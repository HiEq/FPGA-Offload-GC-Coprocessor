name: lint

# Scope: this workflow checks that the sources PARSE (shell, Python,
# PowerShell), compiles the RTL with Icarus, and runs the two directed
# command-FIFO / stale-R regressions. It does not run xsim, Vivado, PetaLinux,
# board tests, or anything that needs a licence, so a green run is not evidence
# that the full design works - see README's "测量口径" and AGENTS.md's evidence
# ladder.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: shell syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: python syntax (py_compile)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            python3 -m py_compile "$f" || { echo "PY FAIL: $f"; fail=1; }
          done < <(git ls-files '*.py')
          exit $fail

      - name: ruff (syntax / undefined names)
        run: |
          python3 -m venv /tmp/rvenv
          /tmp/rvenv/bin/pip install -q ruff==0.17.1
          /tmp/rvenv/bin/ruff check --select E9,F63,F7,F82 .

      - name: RTL syntax (iverilog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          iverilog -g2005 -tnull -s gc_top \
              rtl/gc_top.v rtl/gc_mark_engine.v rtl/gc_axi_read.v \
              rtl/gc_regs.v rtl/gc_bitmap.v rtl/gc_queue.v

      - name: directed RTL tests (Icarus)
        run: |
          set -e
          iverilog -g2012 -o /tmp/tb_cmdfifo \
              rtl/gc_axi_read.v sim/tb_cmdfifo_flush.v
          vvp /tmp/tb_cmdfifo | tee /tmp/tb_cmdfifo.log
          ! grep -q '\[CMDFIFO\]\[FAIL\]' /tmp/tb_cmdfifo.log
          grep -q '\[CMDFIFO\] ==================== PASS' /tmp/tb_cmdfifo.log

          iverilog -g2012 -o /tmp/tb_race \
              rtl/gc_axi_read.v sim/axi_proto_check.v sim/tb_runstart_race.v
          vvp /tmp/tb_race | tee /tmp/tb_race.log
          ! grep -q '\[RACE\]\[FAIL\]' /tmp/tb_race.log
          grep -q '\[RACE\] ==================== PASS' /tmp/tb_race.log

      - name: flush and duplicate-start regressions (Icarus)
        run: |
          set -e

          iverilog -g2012 -o /tmp/tb_stale \
              rtl/gc_axi_read.v sim/tb_stale_ar_flush.v
          vvp /tmp/tb_stale | tee /tmp/tb_stale.log
          ! grep -q '\[STALE-AR\]\[FAIL\]' /tmp/tb_stale.log
          grep -q '\[STALE-AR\] ==================== PASS' /tmp/tb_stale.log

          iverilog -g2012 -o /tmp/tb_flush \
              rtl/gc_axi_read.v sim/tb_flush_data.v
          vvp /tmp/tb_flush | tee /tmp/tb_flush.log
          ! grep -q '\[FLUSH-DATA\]\[FAIL\]' /tmp/tb_flush.log
          grep -q '\[FLUSH-DATA\] ==================== PASS' /tmp/tb_flush.log

          iverilog -g2012 -o /tmp/tb_busy \
              rtl/gc_top.v rtl/gc_mark_engine.v rtl/gc_axi_read.v \
              rtl/gc_regs.v rtl/gc_bitmap.v rtl/gc_queue.v \
              sim/tb_start_while_busy.v
          vvp /tmp/tb_busy | tee /tmp/tb_busy.log
          ! grep -q '\[BUSY-START\]\[FAIL\]' /tmp/tb_busy.log
          grep -q '\[BUSY-START\] ==================== PASS' /tmp/tb_busy.log

      - name: C warnings (gcc -Wall -Wextra -Werror)
        run: |
          gcc -O2 -Wall -Wextra -Werror -fsyntax-only \
              csrc/fpga_gc.c csrc/test_main.c csrc/cmark.c

      - name: C driver host tests (no /dev/mem)
        run: |
          gcc -O2 -Wall -Wextra -Werror -pthread -I csrc \
              csrc/fpga_gc.c csrc/test_fpga_gc_host.c -o /tmp/test_fpga_gc_host
          /tmp/test_fpga_gc_host

      - name: binary manifest (SHA256SUMS)
        shell: pwsh
        run: |
          ./tools/make_manifest.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: powershell parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $err = $null; $tok = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tok, [ref]$err)
            if ($err.Count -gt 0) {
              Write-Host "PARSE FAIL: $($_.FullName)"
              $err | Select-Object -First 3 | ForEach-Object { Write-Host "  $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "all PowerShell files parse"
